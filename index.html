<!doctype html>
<html lang="ca">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Thermal Confort — UTCI</title>

    <link href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css" rel="stylesheet">

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: system-ui, sans-serif;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        #info {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 10;
            background: white;
            padding: 12px 16px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgb(0 0 0 / 20%);
            max-width: 320px;
        }

        #legend {
            position: absolute;
            bottom: 24px;
            right: 12px;
            z-index: 10;
            background: white;
            padding: 12px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgb(0 0 0 / 20%);
            width: 220px;
        }

        #gradient {
            height: 16px;
            margin: 8px 0 4px;

            background: linear-gradient(to right,
                    #313695,
                    #4575b4,
                    #74add1,
                    #abd9e9,
                    #ffffbf,
                    #fdae61,
                    #f46d43,
                    #d73027,
                    #a50026);
        }

        .legend-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
        }

        #status {
            margin-top: 6px;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <div id="info">
        <strong>Thermal Confort</strong>

        <div>
            UTCI · 5 octubre 2026 · 09:00 UTC
        </div>

        <div id="status">
            Carregant...
        </div>
    </div>

    <div id="legend">

        <strong>UTCI (°C)</strong>

        <div id="gradient"></div>

        <div class="legend-labels">
            <span>-40</span>
            <span>-20</span>
            <span>0</span>
            <span>20</span>
            <span>40+</span>
        </div>

    </div>


    <script type="module">

        // ============================================================
        // IMPORTS
        // ============================================================

        import maplibregl from
            "https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.1/+esm";

        import { fromUrl } from
            "https://cdn.jsdelivr.net/npm/geotiff/+esm";

        import proj4 from
            "https://cdn.jsdelivr.net/npm/proj4@2.19.10/+esm";


        // ============================================================
        // PROJECCIÓ
        // ============================================================

        /*
         * ETRS89 / UTM zone 31N
         *
         * EPSG:25831
         */

        proj4.defs(
            "EPSG:25831",
            "+proj=utm +zone=31 +ellps=GRS80 +units=m +no_defs"
        );


        // ============================================================
        // ELEMENTS HTML
        // ============================================================

        const status =
            document.getElementById("status");


        // ============================================================
        // COG
        // ============================================================

        const COG_URL =
            "./data/utci_2026-10-05T09-00-00.000000000.tif";


        // ============================================================
        // MAPA
        // ============================================================

        const map = new maplibregl.Map({

            container: "map",

            style: {

                version: 8,

                sources: {

                    osm: {

                        type: "raster",

                        tiles: [
                            "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
                        ],

                        tileSize: 256,

                        attribution:
                            "© OpenStreetMap contributors"
                    }
                },

                layers: [

                    {
                        id: "osm",

                        type: "raster",

                        source: "osm"
                    }
                ]
            },

            center: [
                1.7,
                41.7
            ],

            zoom: 7
        });


        map.addControl(
            new maplibregl.NavigationControl(),
            "top-right"
        );


        // ============================================================
        // LLEGIR COG
        // ============================================================

        async function loadCOG() {

            status.textContent =
                "Obrint COG...";


            // --------------------------------------------------------
            // OBRIR TIFF
            // --------------------------------------------------------

            const tiff =
                await fromUrl(COG_URL);

            const image =
                await tiff.getImage();


            const width =
                image.getWidth();

            const height =
                image.getHeight();

            const bbox =
                image.getBoundingBox();

            const resolution =
                image.getResolution();


            console.log("COG:", {

                width,

                height,

                bbox,

                resolution,

                samples:
                    image.getSamplesPerPixel()
            });


            status.textContent =
                "Llegint raster complet...";


            // ========================================================
            // LLEGIR TOT EL RASTER
            // ========================================================

            /*
             * Ara llegim tot el raster:
             *
             * 2690 × 2620 ≈ 7 milions de píxels
             *
             * És una prova inicial.
             * Més endavant aprofitarem els overviews del COG
             * per no haver de llegir tot el raster.
             */

            const raster =
                await image.readRasters({
                    interleave: true
                });


            const rasterWidth =
                width;

            const rasterHeight =
                height;


            console.log(
                "Raster complet llegit:",
                rasterWidth,
                "×",
                rasterHeight
            );


            // ========================================================
            // ESCALA UTCI → COLOR
            // ========================================================

            function utciColor(value) {

                /*
                 * Nodata / NaN
                 */

                if (!Number.isFinite(value)) {

                    return [
                        0,
                        0,
                        0,
                        0
                    ];
                }


                /*
                 * Escala provisional:
                 *
                 * -40 °C → blau
                 *   0 °C → groc/blanc
                 * +40 °C → vermell
                 */

                const t =
                    Math.max(
                        0,
                        Math.min(
                            1,
                            (value + 40) / 80
                        )
                    );


                let r;
                let g;
                let b;


                // ----------------------------------------------------
                // -40 → -20
                // ----------------------------------------------------

                if (t < 0.25) {

                    const p =
                        t / 0.25;


                    r =
                        49 +
                        (69 - 49) * p;

                    g =
                        54 +
                        (117 - 54) * p;

                    b =
                        149 +
                        (180 - 149) * p;
                }


                // ----------------------------------------------------
                // -20 → 0
                // ----------------------------------------------------

                else if (t < 0.5) {

                    const p =
                        (t - 0.25) / 0.25;


                    r =
                        69 +
                        (255 - 69) * p;

                    g =
                        117 +
                        (255 - 117) * p;

                    b =
                        180 +
                        (191 - 180) * p;
                }


                // ----------------------------------------------------
                // 0 → +20
                // ----------------------------------------------------

                else if (t < 0.75) {

                    const p =
                        (t - 0.5) / 0.25;


                    r =
                        255 +
                        (244 - 255) * p;

                    g =
                        255 +
                        (109 - 255) * p;

                    b =
                        191 +
                        (67 - 191) * p;
                }


                // ----------------------------------------------------
                // +20 → +40
                // ----------------------------------------------------

                else {

                    const p =
                        (t - 0.75) / 0.25;


                    r =
                        244 +
                        (165 - 244) * p;

                    g =
                        109 +
                        (0 - 109) * p;

                    b =
                        67 +
                        (38 - 67) * p;
                }


                return [

                    Math.round(r),

                    Math.round(g),

                    Math.round(b),

                    220
                ];
            }


            // ========================================================
            // CREAR IMATGE RGBA
            // ========================================================

            status.textContent =
                "Generant visualització...";


            const pixels =
                new Uint8ClampedArray(
                    rasterWidth *
                    rasterHeight *
                    4
                );


            for (
                let i = 0;
                i < raster.length;
                i++
            ) {

                const value =
                    raster[i];


                const [
                    r,
                    g,
                    b,
                    a
                ] =
                    utciColor(value);


                const offset =
                    i * 4;


                pixels[offset] =
                    r;

                pixels[offset + 1] =
                    g;

                pixels[offset + 2] =
                    b;

                pixels[offset + 3] =
                    a;
            }


            // ========================================================
            // CANVAS
            // ========================================================

            const canvas =
                document.createElement("canvas");


            canvas.width =
                rasterWidth;

            canvas.height =
                rasterHeight;


            const context =
                canvas.getContext("2d");


            const imageData =
                new ImageData(
                    pixels,
                    rasterWidth,
                    rasterHeight
                );


            context.putImageData(
                imageData,
                0,
                0
            );


            const imageUrl =
                canvas.toDataURL(
                    "image/png"
                );


            // ========================================================
            // BBOX DEL COG
            // ========================================================

            /*
             * GeoTIFF:
             *
             * [minX, minY, maxX, maxY]
             *
             * EPSG:25831
             */

            const minX =
                bbox[0];

            const minY =
                bbox[1];

            const maxX =
                bbox[2];

            const maxY =
                bbox[3];


            console.log(
                "BBOX COG:",
                [
                    minX,
                    minY,
                    maxX,
                    maxY
                ]
            );


            // ========================================================
            // TRANSFORMACIÓ EPSG:25831 → EPSG:4326
            // ========================================================

            const topLeft =
                proj4(
                    "EPSG:25831",
                    "EPSG:4326",
                    [
                        minX,
                        maxY
                    ]
                );


            const topRight =
                proj4(
                    "EPSG:25831",
                    "EPSG:4326",
                    [
                        maxX,
                        maxY
                    ]
                );


            const bottomRight =
                proj4(
                    "EPSG:25831",
                    "EPSG:4326",
                    [
                        maxX,
                        minY
                    ]
                );


            const bottomLeft =
                proj4(
                    "EPSG:25831",
                    "EPSG:4326",
                    [
                        minX,
                        minY
                    ]
                );


            console.log(
                "Top-left:",
                topLeft
            );

            console.log(
                "Top-right:",
                topRight
            );

            console.log(
                "Bottom-right:",
                bottomRight
            );

            console.log(
                "Bottom-left:",
                bottomLeft
            );


            // ========================================================
            // MAPLIBRE IMAGE SOURCE
            // ========================================================

            map.addSource(
                "utci",
                {

                    type: "image",

                    url: imageUrl,

                    coordinates: [

                        topLeft,

                        topRight,

                        bottomRight,

                        bottomLeft
                    ]
                }
            );


            // ========================================================
            // CAPA UTCI
            // ========================================================

            map.addLayer({

                id: "utci",

                type: "raster",

                source: "utci",

                paint: {

                    "raster-opacity":
                        0.75,

                    "raster-fade-duration":
                        0
                }
            });


            // ========================================================
            // ZOOM A TOT EL RASTER
            // ========================================================

            map.fitBounds(

                [
                    [
                        Math.min(
                            topLeft[0],
                            bottomLeft[0]
                        ),

                        Math.min(
                            bottomLeft[1],
                            bottomRight[1]
                        )
                    ],

                    [
                        Math.max(
                            topRight[0],
                            bottomRight[0]
                        ),

                        Math.max(
                            topLeft[1],
                            topRight[1]
                        )
                    ]
                ],

                {

                    padding: 40,

                    duration: 0
                }
            );


            // ========================================================
            // FINAL
            // ========================================================

            status.textContent =
                `UTCI carregat · ${rasterWidth} × ${rasterHeight} píxels`;
        }


        // ============================================================
        // INICIALITZAR
        // ============================================================

        map.on(
            "load",
            () => {

                loadCOG()
                    .catch(
                        error => {

                            console.error(
                                error
                            );

                            status.textContent =
                                "Error carregant el COG: " +
                                error.message;
                        }
                    );
            }
        );

    </script>

</body>

</html>
