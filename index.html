<!doctype html>
<html lang="ca">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Thermal Confort — COG test</title>

    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        pre {
            background: #f5f5f5;
            padding: 16px;
            overflow: auto;
        }

        #status {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>Thermal Confort</h1>

    <p>Prova de lectura d'un COG remot.</p>

    <pre id="status">Carregant...</pre>

    <script type="module">
        import { fromUrl } from "https://cdn.jsdelivr.net/npm/geotiff/+esm";

        const status = document.getElementById("status");

        const cogUrl =
            "./data/utci_2026-10-05T09-00-00.000000000.tif";

        try {
            status.textContent = "Obrint COG...";

            const tiff = await fromUrl(cogUrl);

            const image = await tiff.getImage();

            const width = image.getWidth();
            const height = image.getHeight();

            const bbox = image.getBoundingBox();

            status.textContent = [
                "COG obert correctament",
                "",
                `Width:  ${width}`,
                `Height: ${height}`,
                "",
                `Bounding box:`,
                bbox.join(", ")
            ].join("\n");

        } catch (error) {
            console.error(error);

            status.textContent =
                "ERROR:\n\n" + error.toString();
        }
    </script>

</body>

</html>
